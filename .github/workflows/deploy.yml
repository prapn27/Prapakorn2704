name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# กันสอง deploy รันซ้อนกัน (migration กับ deploy ต้องเรียงลำดับ)
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  WORKER_NAME: slip-budget
  D1_NAME: slip-budget
  # ที่อยู่ของ Worker (ใช้ทำ smoke test หลัง deploy): <ชื่อ worker>.<subdomain ของบัญชี>.workers.dev
  APP_URL: https://slip-budget.merlinmeow.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Check required settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then echo "::error::ยังไม่ได้ตั้งค่า $v ใน GitHub (Settings → Secrets and variables → Actions)"; missing=1; fi
          done
          exit $missing

      # หา (หรือสร้างครั้งแรก) ฐานข้อมูล D1 ผ่าน Cloudflare API แล้วใส่ id ลง wrangler.jsonc
      - name: Ensure D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          resp=$(curl -sS -H "$auth" "${api}?name=${D1_NAME}")
          echo "$resp" | jq -e '.success == true' >/dev/null || { echo "::error::เรียก Cloudflare API ไม่สำเร็จ (ตรวจสิทธิ์ของ token): $(echo "$resp" | jq -c '.errors')"; exit 1; }
          id=$(echo "$resp" | jq -r --arg n "$D1_NAME" '[.result[] | select(.name == $n)][0].uuid // empty')

          if [ -z "$id" ]; then
            echo "ไม่พบฐานข้อมูล ${D1_NAME} — สร้างใหม่ (ภูมิภาค apac)"
            resp=$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
              -d "{\"name\":\"${D1_NAME}\",\"primary_location_hint\":\"apac\"}" "$api")
            echo "$resp" | jq -e '.success == true' >/dev/null || { echo "::error::สร้าง D1 ไม่สำเร็จ: $(echo "$resp" | jq -c '.errors')"; exit 1; }
            id=$(echo "$resp" | jq -r '.result.uuid')
          fi

          [[ "$id" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::ได้ database id ที่รูปแบบไม่ถูกต้อง"; exit 1; }
          echo "::add-mask::$id"
          sed -i "s/00000000-0000-0000-0000-000000000000/${id}/" wrangler.jsonc
          grep -q "$id" wrangler.jsonc

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$D1_NAME" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker and app
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/")
          echo "GET / -> $code"
          [ "$code" = "200" ] || { echo "::error::หน้าแอพไม่ตอบ 200 ($code) — ตรวจว่า APP_URL ตรงกับ workers.dev subdomain ของบัญชี"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/me")
          echo "GET /api/me (ไม่มี token) -> $code"
          [ "$code" = "401" ] || { echo "::error::/api/me ควรตอบ 401 เมื่อไม่มี token แต่ได้ $code"; exit 1; }
          echo "Deployed: $APP_URL"
